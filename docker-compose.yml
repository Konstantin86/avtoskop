services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avtoskop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avtoskop}
      POSTGRES_DB: ${POSTGRES_DB:-avtoskop}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-avtoskop}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
